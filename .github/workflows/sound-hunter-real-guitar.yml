name: Sound Hunter — Real Guitar Samples
on:
  workflow_dispatch:
  push:
    branches:
      - soundhunter-unbounded-library
    paths:
      - '.github/workflows/sound-hunter-real-guitar.yml'
      - 'SoundHunter/real_guitar_sources.json'
      - 'SoundHunter/sound_hunter_real_guitars.py'
      - 'tests/test_sound_hunter_importer.py'
permissions:
  contents: read
concurrency:
  group: ppgu-sound-hunter-import
  cancel-in-progress: false
jobs:
  discover-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout approved source catalog and importer
        uses: actions/checkout@v4
      - name: List approved real-recorded sources
        run: python3 SoundHunter/sound_hunter_real_guitars.py --discover-only
      - name: Test Sound Hunter path safety and uncapped import behavior
        run: python3 tests/test_sound_hunter_importer.py
      - name: Download, verify and import real guitar audio
        run: python3 SoundHunter/sound_hunter_real_guitars.py
      - name: Copy verified registry
        run: cp Samples/SoundHunterImports/*/SOUND_HUNTER_REGISTRY.json "$RUNNER_TEMP/SOUND_HUNTER_REGISTRY.json"
      - name: Upload registry and provenance
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SOUND-HUNTER-REGISTRY
          path: Samples/SoundHunterImports/*/SOUND_HUNTER_REGISTRY.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Meta Steel Guitar samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-meta-open-sound-steel
          path: Samples/SoundHunterImports/*/meta-open-sound-steel/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Meta Nylon Guitar samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-meta-open-sound-nylon
          path: Samples/SoundHunterImports/*/meta-open-sound-nylon/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload FreePats Clean Electric samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-freepats-electric-clean
          path: Samples/SoundHunterImports/*/freepats-electric-clean/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload FreePats Direct DI samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-freepats-electric-direct
          path: Samples/SoundHunterImports/*/freepats-electric-direct/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload FreePats Distorted 1 samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-freepats-electric-dist1
          path: Samples/SoundHunterImports/*/freepats-electric-dist1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload FreePats Distorted 2 samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-freepats-electric-dist2
          path: Samples/SoundHunterImports/*/freepats-electric-dist2/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload FreePats Jazz Guitar samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-freepats-electric-jazz
          path: Samples/SoundHunterImports/*/freepats-electric-jazz/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload FreePats Spanish Classical samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-freepats-spanish-classical
          path: Samples/SoundHunterImports/*/freepats-spanish-classical/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Karoryfer Black and Green samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-karoryfer-black-green
          path: Samples/SoundHunterImports/*/karoryfer-black-green/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Karoryfer Emilyguitar samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-karoryfer-emilyguitar
          path: Samples/SoundHunterImports/*/karoryfer-emilyguitar/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Karoryfer Shinyguitar samples
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SAMPLES-karoryfer-shinyguitar
          path: Samples/SoundHunterImports/*/karoryfer-shinyguitar/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
