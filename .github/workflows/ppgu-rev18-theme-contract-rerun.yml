name: PPGU REV18 Theme Validation Rerun
on:
  pull_request:
    branches:
      - ui/neon-stage-skin1-completion

permissions:
  contents: write

jobs:
  theme-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Generate all six approved theme packs
        run: python3 tools/generate_rev18_approved_theme_assets.py --root SKIN
      - name: Check deterministic output
        run: python3 tools/generate_rev18_approved_theme_assets.py --root SKIN --check
      - name: Run 27-control regression test
        run: python3 tests/TestRev18ThemeControlParity.py
      - name: Run strict pack, checksum and PNG CRC audit
        run: python3 tools/audit_skin_rev18_assets.py --root SKIN --strict-assets
      - name: Commit generated packs to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKIN
          if ! git diff --cached --quiet; then
            git commit -m "assets(REV18): generate approved premium theme packs"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
