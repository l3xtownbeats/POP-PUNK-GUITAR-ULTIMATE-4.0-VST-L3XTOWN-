name: NEON STAGE DEFAULT SKIN-1 Build

concurrency:
  group: neon-stage-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/neon-stage-build-engine
      - work/neon-stage-reference-preview-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-skin:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run asset pipeline
        shell: cmd
        env:
          CI: "true"
        run: NEON_STAGE_BUILD.bat

      - name: Validate merged Skin Studio pack (G1-G4)
        shell: pwsh
        run: python tools/validate_skin_pack.py --root SKIN --manifest SKIN/theme_pack_manifest.json
      - name: Validate complete skin registry and manifests
        shell: pwsh
        run: python tests/ValidateSkinManifests.py

      # Promote only the two reviewed gallery images on the dedicated review branch.
      # All other generated sprites remain staging artifacts until separately reviewed.
      - name: Sync reviewed NEON STAGE preview and hero to Skin_052
        if: github.ref_name == 'work/neon-stage-reference-preview-fix'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = $env:GITHUB_REF_NAME
          $sourceRoot = Join-Path $PWD 'dist/neon_stage_staging/Skin_052/assets'
          $targetRoot = Join-Path $PWD 'SKIN/Skin_052/assets'
          foreach ($name in @('preview.png', 'hero.png')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot $name))) {
              throw "Generated NEON STAGE asset is missing: $name"
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $pushed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            # Rebase the asset promotion on the newest branch tip. Reset only tracked
            # files; generated dist/ assets remain available for the next attempt.
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "git fetch failed on attempt $attempt" }
            git reset --hard "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "git reset failed on attempt $attempt" }

            foreach ($name in @('preview.png', 'hero.png')) {
              $source = Join-Path $sourceRoot $name
              $target = Join-Path $targetRoot $name
              Copy-Item -LiteralPath $source -Destination $target -Force
            }
            git add -- SKIN/Skin_052/assets/preview.png SKIN/Skin_052/assets/hero.png
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "NEON STAGE preview/hero already match the generated assets."
              $pushed = $true
              break
            }

            git commit -m "assets: sync reviewed NEON STAGE preview and hero"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed on attempt $attempt" }
            git push origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            Write-Warning "Branch advanced during asset promotion; retrying against latest tip ($attempt/4)."
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $pushed) {
            throw "Unable to promote NEON STAGE preview/hero after four concurrent-update retries."
          }
      - name: Upload staging package and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-stage-default-skin-1-staging
          if-no-files-found: warn
          path: |
            dist/NEON_STAGE_DEFAULT_SKIN_1_STAGING.zip
            dist/NEON_STAGE_BUILD_REPORT.json
            dist/neon_stage_staging/palette_report.json
