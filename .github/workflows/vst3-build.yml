name: POP PUNK GUITAR ULTIMATE - Windows VST3
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'SKIN/**'
      - 'tools/**'
      - '.github/workflows/vst3-build.yml'
      - 'presets/factory_bank_300.json'
      - 'tools/validate_factory_bank.py'
      - 'tools/validate_preset_files.py'
      - 'presets/examples/**'
      - 'docs/**'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 7.0.12
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 7.0.12
          path: JUCE
          persist-credentials: false
      - name: Install artwork generator dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate and validate missing legacy skin artwork
        shell: pwsh
        run: |
          python tools/T2_generate_missing_artwork.py --root SKIN
          python tools/T2_generate_missing_artwork.py --root SKIN --check
      - name: Validate 300-preset factory catalog
        shell: pwsh
        run: python tools/validate_factory_bank.py presets/factory_bank_300.json
      - name: Audit REV.18 READY evidence (non-strict until factory targets are met)
        shell: pwsh
        run: |
          python tools/validate_rev18_factory_readiness.py presets/factory_bank_300.json
          if ($LASTEXITCODE -ne 0) { throw 'REV.18 READY evidence audit found invalid catalog claims.' }
          python tests/test_rev18_factory_readiness.py
          if ($LASTEXITCODE -ne 0) { throw 'REV.18 READY evidence unit tests failed.' }

      - name: Validate portable preset file examples
        shell: pwsh
        run: python tools/validate_preset_files.py presets/examples
      - name: Validate APVTS parameter registry and state persistence
        shell: pwsh
        run: python tools/validate_apvts_layout.py Source/PluginProcessor.cpp

      - name: Validate PPGU REV 14 skin pack (contrast, parity, assets, identity)
        shell: pwsh
        run: python tools/validate_skin_pack.py --root SKIN --manifest SKIN/theme_pack_manifest.json

      - name: Select checked-out project source
        shell: pwsh
        run: |
          # The repository root is the authoritative source tree. Do not require
          # an externally uploaded source_bundle.zip (it is not part of this repo).
          $project = Get-Item -LiteralPath $PWD
          if (-not (Test-Path (Join-Path $project.FullName 'CMakeLists.txt'))) { throw 'Repository-root CMakeLists.txt was not found.' }
          "PROJECT_DIR=$($project.FullName)" >> $env:GITHUB_ENV

      # Preset catalog validation is performed from the checked-in JSON above.
      # Do not mutate source files during CI; preset content belongs in reviewed commits.

      - name: Publish extracted source for final implementation review
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PROJECT_DIR/*" -DestinationPath "$env:RUNNER_TEMP/POP_PUNK_GUITAR_SOURCE_REVIEW.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: POP-PUNK-GUITAR-SOURCE-REVIEW
          path: ${{ runner.temp }}/POP_PUNK_GUITAR_SOURCE_REVIEW.zip
          if-no-files-found: error

      - name: Restore redistributable sample library cache
        id: sample-cache
        uses: actions/cache@v4
        with:
          path: Samples
          key: ppgu-samples-meta-v1.0.0-freepats-fsbs-cc0-v1

      - name: Download redistributable guitar sample libraries
        if: steps.sample-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sampleRoot = Join-Path $env:PROJECT_DIR 'Samples'
          New-Item -ItemType Directory -Force -Path $sampleRoot | Out-Null
          $headers = @{ 'User-Agent' = 'POP-PUNK-GUITAR-ULTIMATE-build'; 'Accept' = 'application/vnd.github+json' }

          # Release asset downloads occasionally return transient 502/503/504 responses.
          # Retry with exponential backoff; never accept an empty/partial archive.
          function Invoke-DownloadWithRetry([string]$Uri, [string]$OutFile, [hashtable]$RequestHeaders) {
            $maxAttempts = 7
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                if (Test-Path $OutFile) { Remove-Item -LiteralPath $OutFile -Force }
                Invoke-WebRequest -Headers $RequestHeaders -Uri $Uri -OutFile $OutFile -TimeoutSec 600
                if (-not (Test-Path $OutFile) -or (Get-Item -LiteralPath $OutFile).Length -lt 1048576) {
                  throw 'Downloaded archive is missing or unexpectedly small.'
                }
                return
              } catch {
                if (Test-Path $OutFile) { Remove-Item -LiteralPath $OutFile -Force }
                if ($attempt -eq $maxAttempts) {
                  throw "Download failed after $maxAttempts attempts: $Uri. Last error: $($_.Exception.Message)"
                }
                $delay = [Math]::Min(90, 5 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "Download attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delay seconds."
                Start-Sleep -Seconds ([int]$delay)
              }
            }
          }

          # Meta Open Sound: original 24-bit/48 kHz multisamples, CC0 1.0.
          # Release WAV archives contain audio only; SFZ maps and license metadata live in the source tree.
          $metaRepo = Join-Path $env:RUNNER_TEMP 'Meta-open-sound'
          git clone --depth 1 https://github.com/facebookincubator/Meta-open-sound.git $metaRepo
          foreach ($id in @('meta-steel-guitar', 'meta-nylon-guitar')) {
            $tag = "$id-v1.0.0"
            $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/facebookincubator/Meta-open-sound/releases/tags/$tag"
            $asset = $release.assets | Where-Object { $_.name -eq "meta-open-sound-$id-wav.zip" -or $_.name -eq "$id-wav.zip" } | Select-Object -First 1
            if (-not $asset) { throw "WAV ZIP asset missing for $tag. Available: $($release.assets.name -join ', ')" }
            $dest = Join-Path $sampleRoot "Meta-$id"
            $zip = Join-Path $env:RUNNER_TEMP "$id.zip"
            Invoke-DownloadWithRetry -Uri $asset.browser_download_url -OutFile $zip -RequestHeaders $headers
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $sourceDir = Join-Path $metaRepo "systems/instruments/$id"
            foreach ($file in @("$id.sfz", 'LICENSE', 'SHA256SUMS', 'README.md', 'manifest.json')) {
              $sourceFile = Join-Path $sourceDir $file
              if (-not (Test-Path $sourceFile)) { throw "Meta source metadata missing: $sourceFile" }
              Copy-Item -LiteralPath $sourceFile -Destination $dest
            }
            if (-not (Get-ChildItem $dest -Recurse -Filter '*.wav' | Select-Object -First 1)) { throw "No WAV samples extracted for $tag." }
          }

          # FreePats electric guitars: recorded clean and two distorted variants, CC0 1.0.
          $freepats = @(
            @{ repo='electric-guitar-FSBS-clean'; folder='FreePats-Clean' },
            @{ repo='electric-guitar-FSBS-dist1'; folder='FreePats-Distortion-1' },
            @{ repo='electric-guitar-FSBS-dist2'; folder='FreePats-Distortion-2' }
          )
          foreach ($item in $freepats) {
            $dest = Join-Path $sampleRoot $item.folder
            git clone --depth 1 "https://github.com/freepats/$($item.repo).git" $dest
            if (-not (Get-ChildItem $dest -Recurse -Filter '*.sfz' | Select-Object -First 1)) { throw "SFZ map missing for $($item.repo)." }
            if (-not (Test-Path (Join-Path $dest 'LICENSE.txt'))) { throw "License missing for $($item.repo)." }
          }

          # Keep source licenses and SFZ maps, but strip cloned Git metadata
          # from the redistributable package and its reusable CI cache.
          Get-ChildItem $sampleRoot -Directory -Force -Recurse -Filter '.git' |
            Remove-Item -Recurse -Force
          $wavFiles = Get-ChildItem $sampleRoot -Recurse -File -Filter '*.wav'
          if ($wavFiles.Count -lt 100) { throw "Expected a substantial multisample library; only $($wavFiles.Count) WAV files found." }
          $hashLines = foreach ($file in $wavFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $relative = $file.FullName.Substring($sampleRoot.Length + 1).Replace('\','/')
            "$hash  $relative"
          }
          $hashLines | Set-Content -Encoding utf8 (Join-Path $sampleRoot 'SHA256SUMS-POP-PUNK.txt')
          @'
          Sample library sources included in this package:
          - Meta Open Sound Meta Steel Guitar and Meta Nylon Guitar, CC0 1.0 Universal.
            https://github.com/facebookincubator/Meta-open-sound
          - FreePats FSBS Clean, Distortion 1 and Distortion 2 electric guitars, CC0 1.0.
            https://github.com/freepats/electric-guitar-FSBS-clean
            https://github.com/freepats/electric-guitar-FSBS-dist1
            https://github.com/freepats/electric-guitar-FSBS-dist2
          Original license files, SFZ maps and source checksum manifests are retained beside the samples.
          SHA256SUMS-POP-PUNK.txt contains hashes for every packaged WAV file.
          '@ | Set-Content -Encoding utf8 (Join-Path $sampleRoot 'SAMPLE_SOURCES_AND_LICENSES.txt')

      - name: Validate restored sample library and licenses
        shell: pwsh
        run: |
          $sampleRoot = Join-Path $env:PROJECT_DIR 'Samples'
          $wavFiles = Get-ChildItem $sampleRoot -Recurse -File -Filter '*.wav'
          if ($wavFiles.Count -lt 100) { throw "Sample cache is incomplete: only $($wavFiles.Count) WAV files found." }
          foreach ($license in @(
            'Meta-meta-steel-guitar/LICENSE',
            'Meta-meta-nylon-guitar/LICENSE',
            'FreePats-Clean/LICENSE.txt',
            'FreePats-Distortion-1/LICENSE.txt',
            'FreePats-Distortion-2/LICENSE.txt'
          )) {
            if (-not (Test-Path (Join-Path $sampleRoot $license))) { throw "Required sample license missing: $license" }
          }
          $gitDirs = Get-ChildItem $sampleRoot -Directory -Force -Recurse -Filter '.git'
          if ($gitDirs.Count -gt 0) { throw 'Git metadata must not be included in the sample package.' }

          # Re-verify every WAV even when the Actions cache was restored.
          $manifestPath = Join-Path $sampleRoot 'SHA256SUMS-POP-PUNK.txt'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'Sample SHA-256 manifest is missing.' }
          $manifestEntries = @{}
          foreach ($line in Get-Content -LiteralPath $manifestPath) {
            if ($line -notmatch '^(?<hash>[0-9a-fA-F]{64})\s{2}(?<path>.+)$') {
              throw "Malformed sample checksum manifest line: $line"
            }
            $relative = $Matches.path.Trim().Replace('\','/')
            if ($manifestEntries.ContainsKey($relative)) { throw "Duplicate sample manifest path: $relative" }
            $manifestEntries[$relative] = $Matches.hash.ToLowerInvariant()
          }
          if ($manifestEntries.Count -ne $wavFiles.Count) {
            throw "Sample manifest count mismatch: manifest=$($manifestEntries.Count), WAV files=$($wavFiles.Count)."
          }
          foreach ($file in $wavFiles) {
            $relative = $file.FullName.Substring($sampleRoot.Length + 1).Replace('\','/')
            if (-not $manifestEntries.ContainsKey($relative)) { throw "WAV missing from SHA-256 manifest: $relative" }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            if ($actualHash -ne $manifestEntries[$relative]) { throw "SHA-256 mismatch for sample: $relative" }
          }

      - name: Validate JUCE BinaryData include, link and declaration order
        shell: pwsh
        run: python tools/check_binary_data_links.py

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S "$env:PROJECT_DIR" -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and test executables
        run: cmake --build build --config Release --parallel

      - name: Run CTest regression suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate VST3 bundle
        id: vst3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found after successful build.' }
          "path=$($plugin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run pluginval strictness level 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          $toolDir = Join-Path $env:RUNNER_TEMP 'pluginval'
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $archive -TimeoutSec 180
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          $validator = Get-ChildItem -LiteralPath $toolDir -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $validator) { throw 'pluginval.exe was not found in the official Windows release archive.' }
          # Start-Process exposes the real native process exit code reliably on
          # Windows PowerShell, including GUI-subsystem executables. The pluginval
          # log must end in SUCCESS and the process must return zero.
          $pluginPath = "${{ steps.vst3.outputs.path }}"
          $arguments = @('--strictness-level', '5', ('"{0}"' -f $pluginPath))
          $validationProcess = Start-Process -FilePath $validator.FullName -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($validationProcess.ExitCode -ne 0) {
            throw "pluginval strictness level 5 failed with exit code $($validationProcess.ExitCode)."
          }

      - name: Record host validation limitation
        shell: pwsh
        run: |
          Write-Host 'Automated pluginval strictness level 5 completed. FL Studio 20 manual host acceptance remains a separate required check.'

      - name: Package interim CI validation bundle (not final REV.18 release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          # Final user-facing package layout. Keep the VST3 bundle in its own
          # folder so it can be copied directly into the system VST3 directory.
          $folders = @('VST3', 'SOUNDBANK', 'PRESETS', 'Skins', 'Resources', 'Assets')
          foreach ($folder in $folders) {
            New-Item -ItemType Directory -Force -Path (Join-Path $release $folder) | Out-Null
          }

          Copy-Item -LiteralPath '${{ steps.vst3.outputs.path }}' -Destination (Join-Path $release 'VST3') -Recurse
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'Samples/*') -Destination (Join-Path $release 'SOUNDBANK') -Recurse
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'presets/*') -Destination (Join-Path $release 'PRESETS') -Recurse
          # Runtime skin payload is a sibling of VST3/, so both can be copied
          # into the host's Common Files\\VST3 directory. Do not ship SKIN source docs.
          $runtimeSkins = Join-Path $release 'Skins'
          Get-ChildItem (Join-Path $env:PROJECT_DIR 'SKIN') -Directory -Filter 'Skin_*' |
            Copy-Item -Destination $runtimeSkins -Recurse
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/theme_manifest.json') -Destination $runtimeSkins
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/theme.schema.json') -Destination $runtimeSkins
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/control_schema.json') -Destination $runtimeSkins
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'assets/*') -Destination (Join-Path $release 'Assets') -Recurse

          # Keep human-readable install notes and provenance in Resources.
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/README.md') -Destination (Join-Path $release 'Resources/SKINS_README.md')
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/theme.schema.json') -Destination (Join-Path $release 'Resources/theme.schema.json')
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/control_schema.json') -Destination (Join-Path $release 'Resources/control_schema.rev14.json')
          Copy-Item -LiteralPath (Join-Path $release 'SOUNDBANK/SAMPLE_SOURCES_AND_LICENSES.txt') -Destination (Join-Path $release 'Resources/SOUNDBANK_SOURCES_AND_LICENSES.txt')
          Copy-Item -LiteralPath (Join-Path $release 'SOUNDBANK/SHA256SUMS-POP-PUNK.txt') -Destination (Join-Path $release 'Resources/SOUNDBANK_SHA256SUMS.txt')

          $skinRegistryPath = Join-Path $runtimeSkins 'theme_manifest.json'
          $skinRegistry = Get-Content -LiteralPath $skinRegistryPath -Raw | ConvertFrom-Json
          $expectedSkinCount = [int]$skinRegistry.totalSkins
          if ($expectedSkinCount -lt 1 -or @($skinRegistry.themes).Count -ne $expectedSkinCount) { throw 'Skin registry totalSkins does not match its themes array.' }
          $skinManifests = Get-ChildItem $runtimeSkins -Recurse -File -Filter 'theme.json'
          if ($skinManifests.Count -ne $expectedSkinCount) { throw "Runtime Skins manifest count mismatch: registry=$expectedSkinCount, files=$($skinManifests.Count)." }
          foreach ($theme in $skinRegistry.themes) {
            $manifestPath = Join-Path $runtimeSkins $theme.path
            if (-not (Test-Path -LiteralPath $manifestPath)) { throw "Registered runtime skin manifest missing: $($theme.path)" }
            $themeData = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($themeData.id -ne $theme.id -or $themeData.index -ne $theme.index) {
              throw "Runtime skin identity mismatch for $($theme.path)."
            }
            $compatibility = $themeData.compatibility
            if ($compatibility.apvtsChanges -or $compatibility.layoutChanges -or $compatibility.audioChanges) {
              throw "Runtime skin '$($theme.id)' violates visual-only compatibility."
            }
          }
          $presetCatalog = Join-Path $release 'PRESETS/factory_bank_300.json'
          if (-not (Test-Path $presetCatalog)) { throw 'Factory preset catalog missing from PRESETS.' }
          $soundFiles = Get-ChildItem (Join-Path $release 'SOUNDBANK') -Recurse -File -Filter '*.wav'
          if ($soundFiles.Count -lt 100) { throw "SOUNDBANK is incomplete: only $($soundFiles.Count) WAV files found." }
          $vst3Bundle = Get-ChildItem (Join-Path $release 'VST3') -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst3Bundle) { throw 'VST3 bundle missing from VST3 package folder.' }

          @'
          POP PUNK GUITAR ULTIMATE — INTERIM WINDOWS x64 CI BUILD (NOT FINAL RELEASE)
          =============================================================================
          STATUS: CI VALIDATION ARTIFACT ONLY. NOT A FINAL REV.18 PRODUCT RELEASE.
          VST3/       The compiled Windows x64 VST3 plugin bundle.
          SOUNDBANK/  CI sample payload, SFZ maps, upstream license files and SHA-256 manifest.
                      Sound Hunter asset-level registry is empty; final factory admission is pending.
          PRESETS/    Legacy factory catalogue (300 authored definitions) and portable examples.
                      Not the REV.18 target of 500 READY MELODY + 500 READY PATTERN.
          Skins/      Registry-driven visual themes and both legacy/REV14 schema contracts; copy beside the VST3 bundle.
          Resources/  Install notes, source/license summary, checksums and skin documentation.
          Assets/     Product artwork and visual assets.

          INSTALL (DEVELOPMENT / QA ONLY):
          1. Copy the .vst3 bundle from VST3/ AND the Skins/ folder into:
             C:\Program Files\Common Files\VST3\
             Keep Skins/ beside the .vst3 bundle; do not place it in AppData.
          2. In the plugin, use its SFZ load control and select an instrument SFZ
             from SOUNDBANK/. Keep SOUNDBANK on disk.
          3. The factory preset catalog is embedded in the plugin and also shipped
             as PRESETS/factory_bank_300.json. Portable preset examples are in PRESETS/examples/.
          4. Skins/ is the runtime palette directory beside the .vst3 bundle. Use SKIN or Ctrl+K to switch themes.
             Theme switching is visual-only; FL Studio 20 host acceptance remains pending.
          5. See Resources/ for source attribution, licenses, checksums and documentation.

          Automated CMake build, CTest and pluginval results are reported by this workflow.
          FL Studio 20 manual host acceptance remains a separate step and is not implied.
          This interim artifact does not certify 1000 READY presets, full Sound Hunter clearance,
          final FX EDIT / Skin Gallery / Settings acceptance, CPU/RAM targets or release readiness.
          '@ | Set-Content -Encoding utf8 (Join-Path $release 'INSTALL_AND_CONTENTS.txt')

          $zipPath = Join-Path $PWD 'POP_PUNK_GUITAR_ULTIMATE_Windows_x64_VST3_INTERIM_CI_NOT_RELEASE.zip'
          if (Test-Path $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $zipPath -Force

      - uses: actions/upload-artifact@v4
        with:
          name: POP-PUNK-GUITAR-ULTIMATE-Windows-x64-VST3-INTERIM-CI-NOT-RELEASE
          path: POP_PUNK_GUITAR_ULTIMATE_Windows_x64_VST3_INTERIM_CI_NOT_RELEASE.zip
          if-no-files-found: error

