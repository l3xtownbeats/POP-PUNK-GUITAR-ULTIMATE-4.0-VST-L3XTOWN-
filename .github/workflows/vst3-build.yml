name: POP PUNK GUITAR ULTIMATE - Windows VST3
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/vst3-build.yml'
      - 'presets/factory_bank_300.json'
      - 'tools/validate_factory_bank.py'
      - 'tools/validate_preset_files.py'
      - 'presets/examples/**'
      - 'docs/**'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate 300-preset factory catalog
        shell: pwsh
        run: python tools/validate_factory_bank.py presets/factory_bank_300.json
      - name: Validate portable preset file examples
        shell: pwsh
        run: python tools/validate_preset_files.py presets/examples
      - name: Validate APVTS parameter registry and state persistence
        shell: pwsh
        run: python tools/validate_apvts_layout.py Source/PluginProcessor.cpp

      - name: Select checked-out project source
        shell: pwsh
        run: |
          # The repository root is the authoritative source tree. Do not require
          # an externally uploaded source_bundle.zip (it is not part of this repo).
          $project = Get-Item -LiteralPath $PWD
          if (-not (Test-Path (Join-Path $project.FullName 'CMakeLists.txt'))) { throw 'Repository-root CMakeLists.txt was not found.' }
          "PROJECT_DIR=$($project.FullName)" >> $env:GITHUB_ENV

      # Preset catalog validation is performed from the checked-in JSON above.
      # Do not mutate source files during CI; preset content belongs in reviewed commits.

      - name: Publish extracted source for final implementation review
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PROJECT_DIR/*" -DestinationPath "$env:RUNNER_TEMP/POP_PUNK_GUITAR_SOURCE_REVIEW.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: POP-PUNK-GUITAR-SOURCE-REVIEW
          path: ${{ runner.temp }}/POP_PUNK_GUITAR_SOURCE_REVIEW.zip
          if-no-files-found: error

      - name: Restore redistributable sample library cache
        id: sample-cache
        uses: actions/cache@v4
        with:
          path: Samples
          key: ppgu-samples-expanded-cc0-guitar-v2

      - name: Download redistributable guitar sample libraries
        if: steps.sample-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sampleRoot = Join-Path $env:PROJECT_DIR 'Samples'
          New-Item -ItemType Directory -Force -Path $sampleRoot | Out-Null
          $headers = @{ 'User-Agent' = 'POP-PUNK-GUITAR-ULTIMATE-build'; 'Accept' = 'application/vnd.github+json' }

          # Release asset downloads occasionally return transient 502/503/504 responses.
          # Retry with exponential backoff; never accept an empty/partial archive.
          function Invoke-DownloadWithRetry([string]$Uri, [string]$OutFile, [hashtable]$RequestHeaders) {
            $maxAttempts = 7
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                if (Test-Path $OutFile) { Remove-Item -LiteralPath $OutFile -Force }
                Invoke-WebRequest -Headers $RequestHeaders -Uri $Uri -OutFile $OutFile -TimeoutSec 600
                if (-not (Test-Path $OutFile) -or (Get-Item -LiteralPath $OutFile).Length -lt 1048576) {
                  throw 'Downloaded archive is missing or unexpectedly small.'
                }
                return
              } catch {
                if (Test-Path $OutFile) { Remove-Item -LiteralPath $OutFile -Force }
                if ($attempt -eq $maxAttempts) {
                  throw "Download failed after $maxAttempts attempts: $Uri. Last error: $($_.Exception.Message)"
                }
                $delay = [Math]::Min(90, 5 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "Download attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delay seconds."
                Start-Sleep -Seconds ([int]$delay)
              }
            }
          }

          # Meta Open Sound: original 24-bit/48 kHz multisamples, CC0 1.0.
          # Release WAV archives contain audio only; SFZ maps and license metadata live in the source tree.
          $metaRepo = Join-Path $env:RUNNER_TEMP 'Meta-open-sound'
          git clone --depth 1 https://github.com/facebookincubator/Meta-open-sound.git $metaRepo
          foreach ($id in @('meta-steel-guitar', 'meta-nylon-guitar')) {
            $tag = "$id-v1.0.0"
            $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/facebookincubator/Meta-open-sound/releases/tags/$tag"
            $asset = $release.assets | Where-Object { $_.name -eq "meta-open-sound-$id-wav.zip" -or $_.name -eq "$id-wav.zip" } | Select-Object -First 1
            if (-not $asset) { throw "WAV ZIP asset missing for $tag. Available: $($release.assets.name -join ', ')" }
            $dest = Join-Path $sampleRoot "Meta-$id"
            $zip = Join-Path $env:RUNNER_TEMP "$id.zip"
            Invoke-DownloadWithRetry -Uri $asset.browser_download_url -OutFile $zip -RequestHeaders $headers
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $sourceDir = Join-Path $metaRepo "systems/instruments/$id"
            foreach ($file in @("$id.sfz", 'LICENSE', 'SHA256SUMS', 'README.md', 'manifest.json')) {
              $sourceFile = Join-Path $sourceDir $file
              if (-not (Test-Path $sourceFile)) { throw "Meta source metadata missing: $sourceFile" }
              Copy-Item -LiteralPath $sourceFile -Destination $dest
            }
            if (-not (Get-ChildItem $dest -Recurse -Filter '*.wav' | Select-Object -First 1)) { throw "No WAV samples extracted for $tag." }
          }

          # FreePats electric guitars: recorded clean and two distorted variants, CC0 1.0.
          $freepats = @(
            @{ repo='electric-guitar-FSBS-clean'; folder='FreePats-Clean' },
            @{ repo='electric-guitar-FSBS-dist1'; folder='FreePats-Distortion-1' },
            @{ repo='electric-guitar-FSBS-dist2'; folder='FreePats-Distortion-2' }
          )
          foreach ($item in $freepats) {
            $dest = Join-Path $sampleRoot $item.folder
            git clone --depth 1 "https://github.com/freepats/$($item.repo).git" $dest
            if (-not (Get-ChildItem $dest -Recurse -Filter '*.sfz' | Select-Object -First 1)) { throw "SFZ map missing for $($item.repo)." }
            if (-not (Test-Path (Join-Path $dest 'LICENSE.txt'))) { throw "License missing for $($item.repo)." }
          }

          # Additional CC0 electric-guitar collections. Keep each source as a
          # separate bank: do not flatten or overwrite similarly named samples.
          $additional = @(
            @{ repo='sfzinstruments/karoryfer.emilyguitar'; folder='Karoryfer-Emilyguitar'; branch='master'; license='LICENSE'; minWav=300; minFlac=0; sfz='*.sfz' },
            @{ repo='sfzinstruments/karoryfer.shinyguitar'; folder='Karoryfer-Shinyguitar'; branch='master'; license='LICENSE'; minWav=800; minFlac=0; sfz='Programs/*.sfz' },
            @{ repo='sfzinstruments/karoryfer.black-and-green-guitars'; folder='Karoryfer-Black-And-Green'; branch='main'; license='LICENSE'; minWav=1700; minFlac=0; sfz='Programs/*.sfz' },
            @{ repo='freepats/electric-guitar-FSBS-direct'; folder='FreePats-Direct-DI'; branch='main'; license='LICENSE.txt'; minWav=100; minFlac=0; sfz='*.sfz' },
            @{ repo='freepats/electric-guitar-FSBS-jazz'; folder='FreePats-Jazz'; branch='main'; license='LICENSE.txt'; minWav=0; minFlac=100; sfz='*.sfz' }
          )
          foreach ($item in $additional) {
            $dest = Join-Path $sampleRoot $item.folder
            git clone --depth 1 --branch $item.branch "https://github.com/$($item.repo).git" $dest
            if (-not (Test-Path (Join-Path $dest $item.license))) { throw "License missing for $($item.repo)." }
            $wavCount = (Get-ChildItem $dest -Recurse -File -Filter '*.wav').Count
            $flacCount = (Get-ChildItem $dest -Recurse -File -Filter '*.flac').Count
            if ($wavCount -lt $item.minWav -or $flacCount -lt $item.minFlac) {
              throw "Unexpectedly incomplete audio payload for $($item.repo): WAV=$wavCount FLAC=$flacCount"
            }
            if (-not (Get-ChildItem $dest -Recurse -File -Filter '*.sfz' | Select-Object -First 1)) {
              throw "SFZ map missing for $($item.repo)."
            }
          }

          # Keep source licenses and SFZ maps, but strip cloned Git metadata
          # from the redistributable package and its reusable CI cache.
          Get-ChildItem $sampleRoot -Directory -Force -Recurse -Filter '.git' |
            Remove-Item -Recurse -Force
          $wavFiles = Get-ChildItem $sampleRoot -Recurse -File -Filter '*.wav'
          $flacFiles = Get-ChildItem $sampleRoot -Recurse -File -Filter '*.flac'
          if ($wavFiles.Count -lt 3500) { throw "Expanded guitar library is incomplete: only $($wavFiles.Count) WAV files found." }
          if ($flacFiles.Count -lt 100) { throw "FreePats Jazz FLAC bank is incomplete: only $($flacFiles.Count) files found." }
          $audioFiles = @($wavFiles) + @($flacFiles)
          $hashLines = foreach ($file in $audioFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $relative = $file.FullName.Substring($sampleRoot.Length + 1).Replace('\','/')
            "$hash  $relative"
          }
          $hashLines | Set-Content -Encoding utf8 (Join-Path $sampleRoot 'SHA256SUMS-POP-PUNK.txt')
          @'
          Sample library sources included in this package:
          - Meta Open Sound Meta Steel Guitar and Meta Nylon Guitar, CC0 1.0 Universal.
            https://github.com/facebookincubator/Meta-open-sound
          - FreePats FSBS Clean, Distortion 1/2, Direct DI and Jazz electric guitars, CC0 1.0.
            https://github.com/freepats/electric-guitar-FSBS-clean
            https://github.com/freepats/electric-guitar-FSBS-dist1
            https://github.com/freepats/electric-guitar-FSBS-dist2
            https://github.com/freepats/electric-guitar-FSBS-direct
            https://github.com/freepats/electric-guitar-FSBS-jazz
          - Karoryfer Emilyguitar, Shinyguitar and Black And Green Guitars, CC0 1.0.
            https://github.com/sfzinstruments/karoryfer.emilyguitar
            https://github.com/sfzinstruments/karoryfer.shinyguitar
            https://github.com/sfzinstruments/karoryfer.black-and-green-guitars
          Original license files, SFZ maps, source manifests and complete upstream bank folders are retained.
          SHA256SUMS-POP-PUNK.txt contains hashes for every packaged WAV and FLAC file.
          Note: banks remain separate; SFZ opcodes unsupported by PPGU are not silently claimed as runtime-compatible.
          Import a source bank through IMPORT SOUNDS for conversion/indexing; verify the resulting map and mapping report.
          '@ | Set-Content -Encoding utf8 (Join-Path $sampleRoot 'SAMPLE_SOURCES_AND_LICENSES.txt')

      - name: Validate restored sample library and licenses
        shell: pwsh
        run: |
          $sampleRoot = Join-Path $env:PROJECT_DIR 'Samples'
          $wavFiles = Get-ChildItem $sampleRoot -Recurse -File -Filter '*.wav'
          $flacFiles = Get-ChildItem $sampleRoot -Recurse -File -Filter '*.flac'
          if ($wavFiles.Count -lt 3500 -or $flacFiles.Count -lt 100) {
            throw "Expanded sample library is incomplete: WAV=$($wavFiles.Count), FLAC=$($flacFiles.Count)"
          }
          foreach ($license in @(
            'Meta-meta-steel-guitar/LICENSE',
            'Meta-meta-nylon-guitar/LICENSE',
            'FreePats-Clean/LICENSE.txt',
            'FreePats-Distortion-1/LICENSE.txt',
            'FreePats-Distortion-2/LICENSE.txt',
            'Karoryfer-Emilyguitar/LICENSE',
            'Karoryfer-Shinyguitar/LICENSE',
            'Karoryfer-Black-And-Green/LICENSE',
            'FreePats-Direct-DI/LICENSE.txt',
            'FreePats-Jazz/LICENSE.txt'
          )) {
            if (-not (Test-Path (Join-Path $sampleRoot $license))) { throw "Required sample license missing: $license" }
          }
          $gitDirs = Get-ChildItem $sampleRoot -Directory -Force -Recurse -Filter '.git'
          if ($gitDirs.Count -gt 0) { throw 'Git metadata must not be included in the redistributable sample package.' }

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S "$env:PROJECT_DIR" -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and test executables
        run: cmake --build build --config Release --parallel

      - name: Run CTest regression suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate VST3 bundle
        id: vst3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found after successful build.' }
          "path=$($plugin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run pluginval strictness level 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          $toolDir = Join-Path $env:RUNNER_TEMP 'pluginval'
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $archive -TimeoutSec 180
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          $validator = Get-ChildItem -LiteralPath $toolDir -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $validator) { throw 'pluginval.exe was not found in the official Windows release archive.' }
          # Start-Process exposes the real native process exit code reliably on
          # Windows PowerShell, including GUI-subsystem executables. The pluginval
          # log must end in SUCCESS and the process must return zero.
          $pluginPath = "${{ steps.vst3.outputs.path }}"
          $arguments = @('--strictness-level', '5', ('"{0}"' -f $pluginPath))
          $validationProcess = Start-Process -FilePath $validator.FullName -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($validationProcess.ExitCode -ne 0) {
            throw "pluginval strictness level 5 failed with exit code $($validationProcess.ExitCode)."
          }

      - name: Record host validation limitation
        shell: pwsh
        run: |
          Write-Host 'Automated pluginval strictness level 5 completed. FL Studio 20 manual host acceptance remains a separate required check.'

      - name: Package VST3, sample library and factory presets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath '${{ steps.vst3.outputs.path }}' -Destination release -Recurse
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'Samples') -Destination (Join-Path $PWD 'release/Samples') -Recurse
          # Include the validated 300-preset factory catalog and portable preset files.
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'presets') -Destination (Join-Path $PWD 'release/presets') -Recurse
          @'
          POP PUNK GUITAR ULTIMATE - BUILD CONTENTS
          ========================================
          VST3 plugin: included in this archive.
          Multisample assets / sound bank: Samples/ (Meta steel + nylon acoustic; FreePats electric clean + two distorted sets).
          Factory presets: presets/factory_bank_300.json (150 Melody + 150 Pattern presets).
          Portable preset examples: presets/examples/.
          SFZ maps, original license files and source manifests are retained.
          WAV SHA256 manifest: Samples/SHA256SUMS-POP-PUNK.txt
          Preset catalog validation: 300 factory presets + portable preset examples.

          Install the .vst3 bundle to:
          C:\Program Files\Common Files\VST3\
          Keep the Samples folder beside the extracted plugin package. If the plugin's
          sample browser asks for a library folder, select this Samples directory.
          This package does not claim DAW validation; test in FL Studio 20 after install.
          '@ | Set-Content -Encoding utf8 release/INSTALL_AND_CONTENTS.txt
          Compress-Archive -Path release/* -DestinationPath POP_PUNK_GUITAR_ULTIMATE_Windows_x64_VST3_WITH_SAMPLES_AND_PRESETS.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: POP-PUNK-GUITAR-ULTIMATE-Windows-x64-VST3-WITH-SAMPLES-AND-PRESETS
          path: POP_PUNK_GUITAR_ULTIMATE_Windows_x64_VST3_WITH_SAMPLES_AND_PRESETS.zip
          if-no-files-found: error
