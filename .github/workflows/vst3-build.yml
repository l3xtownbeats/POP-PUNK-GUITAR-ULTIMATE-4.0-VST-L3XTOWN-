name: POP PUNK GUITAR ULTIMATE - Windows VST3
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'SKIN/**'
      - 'Sample Library/**'
      - 'tools/**'
      - '.github/workflows/vst3-build.yml'
      - 'presets/factory_bank_300.json'
      - 'tools/validate_factory_bank.py'
      - 'tools/validate_preset_files.py'
      - 'presets/examples/**'
      - 'docs/**'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 7.0.12
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 7.0.12
          path: JUCE
          persist-credentials: false
      - name: Install artwork generator dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate and validate missing legacy skin artwork
        shell: pwsh
        run: |
          python tools/T2_generate_missing_artwork.py --root SKIN
          python tools/T2_generate_missing_artwork.py --root SKIN --check
      - name: Validate 300-preset factory catalog
        shell: pwsh
        run: python tools/validate_factory_bank.py presets/factory_bank_300.json
      - name: Audit REV.18 READY evidence (non-strict until factory targets are met)
        shell: pwsh
        run: |
          python tools/validate_rev18_factory_readiness.py presets/factory_bank_300.json
          if ($LASTEXITCODE -ne 0) { throw 'REV.18 READY evidence audit found invalid catalog claims.' }
          python tests/test_rev18_factory_readiness.py
          if ($LASTEXITCODE -ne 0) { throw 'REV.18 READY evidence unit tests failed.' }

      - name: Validate portable preset file examples
        shell: pwsh
        run: python tools/validate_preset_files.py presets/examples
      - name: Validate APVTS parameter registry and state persistence
        shell: pwsh
        run: python tools/validate_apvts_layout.py Source/PluginProcessor.cpp

      - name: Validate approved REV.19 runtime skins (identity, control parity, PNG CRC/dimensions, SVG safety)
        shell: pwsh
        run: python tools/validate_runtime_skin_registry.py SKIN

      - name: Select checked-out project source
        shell: pwsh
        run: |
          # The repository root is the authoritative source tree. Do not require
          # an externally uploaded source_bundle.zip (it is not part of this repo).
          $project = Get-Item -LiteralPath $PWD
          if (-not (Test-Path (Join-Path $project.FullName 'CMakeLists.txt'))) { throw 'Repository-root CMakeLists.txt was not found.' }
          "PROJECT_DIR=$($project.FullName)" >> $env:GITHUB_ENV

      # Preset catalog validation is performed from the checked-in JSON above.
      # Do not mutate source files during CI; preset content belongs in reviewed commits.

      - name: Assert canonical Samples library workspace
        shell: pwsh
        run: |
          $sampleRoot = Join-Path $env:PROJECT_DIR 'Sample Library'
          if (-not (Test-Path -LiteralPath $sampleRoot -PathType Container)) {
            throw 'Canonical Sample Library workspace is missing; do not replace it with an empty directory.'
          }
          Write-Host 'Canonical Sample Library library workspace confirmed.'

      - name: Restore redistributable sample library cache
        id: sample-cache
        uses: actions/cache@v4
        with:
          path: Sample Library
          key: ppgu-samples-rev18-11-guitar-sources-v2
          restore-keys: |
            ppgu-samples-meta-v1.0.0-freepats-fsbs-cc0-v1

      - name: Download redistributable guitar sample libraries
        if: steps.sample-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sampleRoot = Join-Path $env:PROJECT_DIR 'Sample Library'
          New-Item -ItemType Directory -Force -Path $sampleRoot | Out-Null
          $headers = @{ 'User-Agent' = 'POP-PUNK-GUITAR-ULTIMATE-build'; 'Accept' = 'application/vnd.github+json' }

          # Release asset downloads occasionally return transient 502/503/504 responses.
          # Retry with exponential backoff; never accept an empty/partial archive.
          function Invoke-DownloadWithRetry([string]$Uri, [string]$OutFile, [hashtable]$RequestHeaders) {
            $maxAttempts = 7
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                if (Test-Path $OutFile) { Remove-Item -LiteralPath $OutFile -Force }
                Invoke-WebRequest -Headers $RequestHeaders -Uri $Uri -OutFile $OutFile -TimeoutSec 600
                if (-not (Test-Path $OutFile) -or (Get-Item -LiteralPath $OutFile).Length -lt 1048576) {
                  throw 'Downloaded archive is missing or unexpectedly small.'
                }
                return
              } catch {
                if (Test-Path $OutFile) { Remove-Item -LiteralPath $OutFile -Force }
                if ($attempt -eq $maxAttempts) {
                  throw "Download failed after $maxAttempts attempts: $Uri. Last error: $($_.Exception.Message)"
                }
                $delay = [Math]::Min(90, 5 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "Download attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delay seconds."
                Start-Sleep -Seconds ([int]$delay)
              }
            }
          }

          # Meta Open Sound: original 24-bit/48 kHz multisamples, CC0 1.0.
          # Release WAV archives contain audio only; SFZ maps and license metadata live in the source tree.
          $metaRepo = Join-Path $env:RUNNER_TEMP 'Meta-open-sound'
          git clone --depth 1 https://github.com/facebookincubator/Meta-open-sound.git $metaRepo
          foreach ($id in @('meta-steel-guitar', 'meta-nylon-guitar')) {
            $tag = "$id-v1.0.0"
            $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/facebookincubator/Meta-open-sound/releases/tags/$tag"
            $asset = $release.assets | Where-Object { $_.name -eq "meta-open-sound-$id-wav.zip" -or $_.name -eq "$id-wav.zip" } | Select-Object -First 1
            if (-not $asset) { throw "WAV ZIP asset missing for $tag. Available: $($release.assets.name -join ', ')" }
            $dest = Join-Path $sampleRoot "Meta-$id"
            if (Test-Path -LiteralPath $dest) {
              if (-not (Get-ChildItem $dest -Recurse -File -Filter '*.wav' | Select-Object -First 1) -or -not (Test-Path (Join-Path $dest 'LICENSE')) -or -not (Test-Path (Join-Path $dest "$id.sfz"))) {
                throw "Existing Meta sample folder is incomplete; preserving it rather than overwriting: $dest"
              }
              Write-Host "Inventory hit; preserving existing Meta source: $dest"
              continue
            }
            $zip = Join-Path $env:RUNNER_TEMP "$id.zip"
            Invoke-DownloadWithRetry -Uri $asset.browser_download_url -OutFile $zip -RequestHeaders $headers
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $sourceDir = Join-Path $metaRepo "systems/instruments/$id"
            foreach ($file in @("$id.sfz", 'LICENSE', 'SHA256SUMS', 'README.md', 'manifest.json')) {
              $sourceFile = Join-Path $sourceDir $file
              if (-not (Test-Path $sourceFile)) { throw "Meta source metadata missing: $sourceFile" }
              Copy-Item -LiteralPath $sourceFile -Destination $dest
            }
            if (-not (Get-ChildItem $dest -Recurse -Filter '*.wav' | Select-Object -First 1)) { throw "No WAV samples extracted for $tag." }
          }

          # FreePats electric guitars: recorded clean and two distorted variants, CC0 1.0.
          $freepats = @(
            @{ repo='electric-guitar-FSBS-clean'; folder='FreePats-Clean' },
            @{ repo='electric-guitar-FSBS-dist1'; folder='FreePats-Distortion-1' },
            @{ repo='electric-guitar-FSBS-dist2'; folder='FreePats-Distortion-2' }
          )
          foreach ($item in $freepats) {
            $dest = Join-Path $sampleRoot $item.folder
            if (Test-Path -LiteralPath $dest) {
              if (-not (Get-ChildItem $dest -Recurse -File | Where-Object { $_.Extension -in @('.wav','.flac') } | Select-Object -First 1) -or -not (Get-ChildItem $dest -Recurse -File -Filter '*.sfz' | Select-Object -First 1) -or -not (Test-Path (Join-Path $dest 'LICENSE.txt'))) {
                throw "Existing FreePats folder is incomplete; preserving it rather than overwriting: $dest"
              }
              Write-Host "Inventory hit; preserving existing FreePats source: $dest"
              continue
            }
            git clone --depth 1 "https://github.com/freepats/$($item.repo).git" $dest
            if (-not (Get-ChildItem $dest -Recurse -Filter '*.sfz' | Select-Object -First 1)) { throw "SFZ map missing for $($item.repo)." }
            if (-not (Test-Path (Join-Path $dest 'LICENSE.txt'))) { throw "License missing for $($item.repo)." }
          }

          # Remaining A8-H CC0 guitar sources: FreePats direct + jazz + Spanish classical,
          # and Karoryfer Black And Green, Emilyguitar and Shinyguitar. Preserve every
          # existing folder; only absent sources are cloned into unique paths.
          $additionalSources = @(
            @{ repo='https://github.com/freepats/electric-guitar-FSBS-direct.git'; folder='FreePats-Direct'; license='LICENSE.txt'; map='*.sfz' },
            @{ repo='https://github.com/freepats/electric-guitar-FSBS-jazz.git'; folder='FreePats-Jazz'; license='LICENSE.txt'; map='*.sfz' },
            @{ repo='https://github.com/freepats/spanish-classical-guitar.git'; folder='FreePats-Spanish-Classical'; license='LICENSE'; map='*.sfz' },
            @{ repo='https://github.com/sfzinstruments/karoryfer.black-and-green-guitars.git'; folder='Karoryfer-Black-And-Green'; license='LICENSE'; map='*.sfz' },
            @{ repo='https://github.com/sfzinstruments/karoryfer.emilyguitar.git'; folder='Karoryfer-Emilyguitar'; license='LICENSE'; map='*.sfz' },
            @{ repo='https://github.com/sfzinstruments/karoryfer.shinyguitar.git'; folder='Karoryfer-Shinyguitar'; license='LICENSE'; map='*.sfz' }
          )
          foreach ($item in $additionalSources) {
            $dest = Join-Path $sampleRoot $item.folder
            if (Test-Path -LiteralPath $dest) {
              $audio = Get-ChildItem $dest -Recurse -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.wav','.flac','.ogg','.aiff','.aif','.mp3') } | Select-Object -First 1
              if (-not $audio -or -not (Get-ChildItem $dest -Recurse -File -Filter $item.map | Select-Object -First 1) -or -not (Test-Path (Join-Path $dest $item.license))) {
                throw "Existing guitar source folder is incomplete; preserving it rather than overwriting: $dest"
              }
              Write-Host "Inventory hit; preserving existing guitar source: $dest"
              continue
            }
            git clone --depth 1 $item.repo $dest
            $audio = Get-ChildItem $dest -Recurse -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.wav','.flac','.ogg','.aiff','.aif','.mp3') } | Select-Object -First 1
            if (-not $audio) { throw "No audio samples found for $($item.repo)." }
            if (-not (Get-ChildItem $dest -Recurse -File -Filter $item.map | Select-Object -First 1)) { throw "SFZ map missing for $($item.repo)." }
            if (-not (Test-Path (Join-Path $dest $item.license))) { throw "License missing for $($item.repo)." }
          }

          # Keep source licenses and SFZ maps, but strip cloned Git metadata
          # from the redistributable package and its reusable CI cache.
          Get-ChildItem $sampleRoot -Directory -Force -Recurse -Filter '.git' |
            Remove-Item -Recurse -Force
          $audioExtensions = @('.wav','.flac','.ogg','.aiff','.aif','.mp3')
          $audioFiles = Get-ChildItem $sampleRoot -Recurse -File | Where-Object { $audioExtensions -contains $_.Extension.ToLowerInvariant() }
          if ($audioFiles.Count -lt 100) { throw "Expected a substantial natural-guitar sample library; only $($audioFiles.Count) audio files found." }
          $hashLines = foreach ($file in $audioFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $relative = $file.FullName.Substring($sampleRoot.Length + 1).Replace('\','/')
            "$hash  $relative"
          }
          $hashLines | Set-Content -Encoding utf8 (Join-Path $sampleRoot 'SHA256SUMS-POP-PUNK-REV18.txt')
          @'
          REV.18 natural guitar sources in managed Sample Library:
          - Meta Open Sound Steel Guitar and Nylon Guitar (CC0-1.0): https://github.com/facebookincubator/Meta-open-sound
          - FreePats FSBS Clean, Distortion 1, Distortion 2, Direct and Jazz (CC0-1.0): https://github.com/freepats
          - FreePats Spanish Classical Guitar (CC0-1.0): https://github.com/freepats/spanish-classical-guitar
          - Karoryfer Black And Green Guitars, Emilyguitar and Shinyguitar (CC0-1.0): https://github.com/sfzinstruments
          All source LICENSE files and SFZ maps are retained beside the samples.
          SHA256SUMS-POP-PUNK-REV18.txt contains SHA-256 hashes for every included WAV/FLAC/OGG/AIFF/MP3 file.
          This source batch is not the complete size target; further unique legal guitar assets remain eligible under REV.18 A8-S.
          '@ | Set-Content -Encoding utf8 (Join-Path $sampleRoot 'SAMPLE_SOURCES_AND_LICENSES_REV18.txt')

      - name: Validate restored sample library and licenses
        shell: pwsh
        run: |
          $sampleRoot = Join-Path $env:PROJECT_DIR 'Sample Library'
          $audioExtensions = @('.wav','.flac','.ogg','.aiff','.aif','.mp3')
          $audioFiles = Get-ChildItem $sampleRoot -Recurse -File | Where-Object { $audioExtensions -contains $_.Extension.ToLowerInvariant() }
          if ($audioFiles.Count -lt 100) { throw "Sample cache is incomplete: only $($audioFiles.Count) audio files found." }
          foreach ($license in @(
            'Meta-meta-steel-guitar/LICENSE',
            'Meta-meta-nylon-guitar/LICENSE',
            'FreePats-Clean/LICENSE.txt',
            'FreePats-Distortion-1/LICENSE.txt',
            'FreePats-Distortion-2/LICENSE.txt',
            'FreePats-Direct/LICENSE.txt',
            'FreePats-Jazz/LICENSE.txt',
            'FreePats-Spanish-Classical/LICENSE',
            'Karoryfer-Black-And-Green/LICENSE',
            'Karoryfer-Emilyguitar/LICENSE',
            'Karoryfer-Shinyguitar/LICENSE'
          )) {
            if (-not (Test-Path (Join-Path $sampleRoot $license))) { throw "Required sample license missing: $license" }
          }
          $gitDirs = Get-ChildItem $sampleRoot -Directory -Force -Recurse -Filter '.git'
          if ($gitDirs.Count -gt 0) { throw 'Git metadata must not be included in the sample package.' }

          # Re-verify every WAV even when the Actions cache was restored.
          $manifestPath = Join-Path $sampleRoot 'SHA256SUMS-POP-PUNK-REV18.txt'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'Sample SHA-256 manifest is missing.' }
          $manifestEntries = @{}
          foreach ($line in Get-Content -LiteralPath $manifestPath) {
            if ($line -notmatch '^(?<hash>[0-9a-fA-F]{64})\s{2}(?<path>.+)$') {
              throw "Malformed sample checksum manifest line: $line"
            }
            $relative = $Matches.path.Trim().Replace('\','/')
            if ($manifestEntries.ContainsKey($relative)) { throw "Duplicate sample manifest path: $relative" }
            $manifestEntries[$relative] = $Matches.hash.ToLowerInvariant()
          }
          if ($manifestEntries.Count -ne $audioFiles.Count) {
            throw "Sample manifest count mismatch: manifest=$($manifestEntries.Count), audio files=$($audioFiles.Count)."
          }
          foreach ($file in $audioFiles) {
            $relative = $file.FullName.Substring($sampleRoot.Length + 1).Replace('\','/')
            if (-not $manifestEntries.ContainsKey($relative)) { throw "WAV missing from SHA-256 manifest: $relative" }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            if ($actualHash -ne $manifestEntries[$relative]) { throw "SHA-256 mismatch for sample: $relative" }
          }

      - name: Audit canonical factory sample inventory and SFZ references
        shell: pwsh
        run: python tools/audit_sample_library.py --root 'Sample Library' --output build/sample_library_audit.json

      - name: Validate JUCE BinaryData include, link and declaration order
        shell: pwsh
        run: python tools/check_binary_data_links.py

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S "$env:PROJECT_DIR" -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and test executables
        run: cmake --build build --config Release --parallel

      - name: Run CTest regression suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate VST3 bundle
        id: vst3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found after successful build.' }
          "path=$($plugin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run pluginval strictness level 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          $toolDir = Join-Path $env:RUNNER_TEMP 'pluginval'
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $archive -TimeoutSec 180
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          $validator = Get-ChildItem -LiteralPath $toolDir -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $validator) { throw 'pluginval.exe was not found in the official Windows release archive.' }
          # Start-Process exposes the real native process exit code reliably on
          # Windows PowerShell, including GUI-subsystem executables. The pluginval
          # log must end in SUCCESS and the process must return zero.
          $pluginPath = "${{ steps.vst3.outputs.path }}"
          $arguments = @('--strictness-level', '5', ('"{0}"' -f $pluginPath))
          $validationProcess = Start-Process -FilePath $validator.FullName -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($validationProcess.ExitCode -ne 0) {
            throw "pluginval strictness level 5 failed with exit code $($validationProcess.ExitCode)."
          }

      - name: Record host validation limitation
        shell: pwsh
        run: |
          Write-Host 'Automated pluginval strictness level 5 completed. FL Studio 20 manual host acceptance remains a separate required check.'

      - name: Package interim CI validation bundle (not final REV.18 release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          # Final user-facing package layout. Keep the VST3 bundle in its own
          # folder so it can be copied directly into the system VST3 directory.
          $folders = @('VST3', 'Sample Library', 'Import Sample Guitar', 'PRESETS', 'Skins', 'Resources', 'Source', 'Documents', 'Licenses')
          foreach ($folder in $folders) {
            New-Item -ItemType Directory -Force -Path (Join-Path $release $folder) | Out-Null
          }

          $sampleRoot = Join-Path $env:PROJECT_DIR 'Sample Library'
          if (-not (Test-Path -LiteralPath $sampleRoot -PathType Container)) { throw 'Canonical Sample Library library is missing; release packaging stopped.' }
          $sampleAudio = Get-ChildItem -LiteralPath $sampleRoot -Recurse -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.wav','.flac','.ogg','.aiff','.aif','.mp3') }
          if ($sampleAudio.Count -lt 100) { throw "Canonical Sample Library library is incomplete: only $($sampleAudio.Count) audio files." }
          Copy-Item -LiteralPath '${{ steps.vst3.outputs.path }}' -Destination (Join-Path $release 'VST3') -Recurse
          # Ship the canonical factory library once, at the portable root. There is no SOUNDBANK alias/copy.
          Copy-Item -Path (Join-Path $sampleRoot '*') -Destination (Join-Path $release 'Sample Library') -Recurse
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'presets/*') -Destination (Join-Path $release 'PRESETS') -Recurse
          # Optional source/reference material is shipped separately from runtime payload.
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'Source/*') -Destination (Join-Path $release 'Source') -Recurse
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'CMakeLists.txt') -Destination (Join-Path $release 'Source/CMakeLists.txt')
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'docs/*') -Destination (Join-Path $release 'Documents') -Recurse
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'Info.txt') -Destination (Join-Path $release 'Documents/Info.txt')
          if (Test-Path (Join-Path $env:PROJECT_DIR 'README.md')) { Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'README.md') -Destination (Join-Path $release 'Documents/README.md') }
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'licenses/*') -Destination (Join-Path $release 'Licenses') -Recurse
          # Runtime skin payload is a sibling of VST3/, so both can be copied
          # into the host's Common Files\\VST3 directory. Ship only registry-approved
          # themes; unregistered working drafts must never leak into the runtime bundle.
          $runtimeSkins = Join-Path $release 'Skins'
          $sourceSkinRoot = Join-Path $env:PROJECT_DIR 'SKIN'
          $sourceRegistryPath = Join-Path $sourceSkinRoot 'theme_manifest.json'
          $sourceRegistry = Get-Content -LiteralPath $sourceRegistryPath -Raw | ConvertFrom-Json
          $expectedSkinCount = [int]$sourceRegistry.totalSkins
          if ($expectedSkinCount -lt 1 -or @($sourceRegistry.themes).Count -ne $expectedSkinCount) {
            throw 'Source skin registry totalSkins does not match its themes array.'
          }
          if ($sourceRegistry.defaultSkin -ne 'skin-053') {
            throw "Canonical default theme must be skin-053 (NEON STAGE DEFAULT); found '$($sourceRegistry.defaultSkin)'."
          }
          $defaultEntries = @($sourceRegistry.themes | Where-Object { $_.id -eq 'skin-053' })
          if ($defaultEntries.Count -ne 1 -or $defaultEntries[0].index -ne 53 -or $defaultEntries[0].path -ne 'Skin_053/theme.json') {
            throw 'NEON STAGE DEFAULT registry entry is missing, duplicated or points to the wrong manifest.'
          }
          $defaultSourceManifest = Join-Path $sourceSkinRoot 'Skin_053/theme.json'
          if (-not (Test-Path -LiteralPath $defaultSourceManifest)) {
            throw 'NEON STAGE DEFAULT source theme manifest is missing.'
          }
          $defaultSourceData = Get-Content -LiteralPath $defaultSourceManifest -Raw | ConvertFrom-Json
          if ($defaultSourceData.id -ne 'skin-053' -or $defaultSourceData.name -ne 'NEON STAGE DEFAULT') {
            throw 'Skin_053 identity does not match canonical NEON STAGE DEFAULT.'
          }
          foreach ($theme in $sourceRegistry.themes) {
            $themeManifest = Join-Path $sourceSkinRoot $theme.path
            if (-not (Test-Path -LiteralPath $themeManifest)) {
              throw "Registered source skin manifest missing: $($theme.path)"
            }
            $themeDirectory = Split-Path -Parent $themeManifest
            Copy-Item -LiteralPath $themeDirectory -Destination $runtimeSkins -Recurse
          }
          Copy-Item -LiteralPath $sourceRegistryPath -Destination $runtimeSkins
          Copy-Item -LiteralPath (Join-Path $sourceSkinRoot 'theme.schema.json') -Destination $runtimeSkins
          Copy-Item -LiteralPath (Join-Path $sourceSkinRoot 'control_schema.json') -Destination $runtimeSkins

          # Keep human-readable install notes and provenance in Resources.
          $manualImport = Join-Path $release 'Import Sample Guitar'
          New-Item -ItemType Directory -Force -Path $manualImport | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'Import Sample Guitar/README_RU.md') -Destination $manualImport -Force
          Copy-Item -LiteralPath (Join-Path $PWD 'build/sample_library_audit.json') -Destination (Join-Path $release 'Resources/SAMPLE_LIBRARY_AUDIT.json')
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/README.md') -Destination (Join-Path $release 'Resources/SKINS_README.md')
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/theme.schema.json') -Destination (Join-Path $release 'Resources/theme.schema.json')
          Copy-Item -LiteralPath (Join-Path $env:PROJECT_DIR 'SKIN/control_schema.json') -Destination (Join-Path $release 'Resources/control_schema.rev14.json')
          Copy-Item -LiteralPath (Join-Path $release 'Sample Library/SAMPLE_SOURCES_AND_LICENSES_REV18.txt') -Destination (Join-Path $release 'Resources/SAMPLE_LIBRARY_SOURCES_AND_LICENSES_REV18.txt')
          Copy-Item -LiteralPath (Join-Path $release 'Sample Library/SHA256SUMS-POP-PUNK-REV18.txt') -Destination (Join-Path $release 'Resources/SAMPLE_LIBRARY_SHA256SUMS_REV18.txt')

          $skinRegistryPath = Join-Path $runtimeSkins 'theme_manifest.json'
          $skinRegistry = Get-Content -LiteralPath $skinRegistryPath -Raw | ConvertFrom-Json
          $expectedSkinCount = [int]$skinRegistry.totalSkins
          if ($expectedSkinCount -lt 1 -or @($skinRegistry.themes).Count -ne $expectedSkinCount) { throw 'Skin registry totalSkins does not match its themes array.' }
          $skinManifests = Get-ChildItem $runtimeSkins -Recurse -File -Filter 'theme.json'
          if ($skinManifests.Count -ne $expectedSkinCount) { throw "Runtime Skins manifest count mismatch: registry=$expectedSkinCount, files=$($skinManifests.Count)." }
          $packagedDefault = Join-Path $runtimeSkins 'Skin_053/theme.json'
          if (-not (Test-Path -LiteralPath $packagedDefault)) {
            throw 'Portable ZIP is missing the required NEON STAGE DEFAULT runtime theme.'
          }
          $packagedDefaultData = Get-Content -LiteralPath $packagedDefault -Raw | ConvertFrom-Json
          if ($packagedDefaultData.id -ne 'skin-053' -or $packagedDefaultData.name -ne 'NEON STAGE DEFAULT') {
            throw 'Packaged NEON STAGE DEFAULT identity validation failed.'
          }
          foreach ($theme in $skinRegistry.themes) {
            $manifestPath = Join-Path $runtimeSkins $theme.path
            if (-not (Test-Path -LiteralPath $manifestPath)) { throw "Registered runtime skin manifest missing: $($theme.path)" }
            $themeData = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($themeData.id -ne $theme.id -or $themeData.index -ne $theme.index) {
              throw "Runtime skin identity mismatch for $($theme.path)."
            }
            $compatibility = $themeData.compatibility
            if ($compatibility.apvtsChanges -or $compatibility.layoutChanges -or $compatibility.audioChanges) {
              throw "Runtime skin '$($theme.id)' violates visual-only compatibility."
            }
          }
          $presetCatalog = Join-Path $release 'PRESETS/factory_bank_300.json'
          if (-not (Test-Path $presetCatalog)) { throw 'Factory preset catalog missing from PRESETS.' }
          $soundExtensions = @('.wav','.flac','.ogg','.aiff','.aif','.mp3')
          $soundFiles = Get-ChildItem (Join-Path $release 'Sample Library') -Recurse -File | Where-Object { $soundExtensions -contains $_.Extension.ToLowerInvariant() }
          if ($soundFiles.Count -lt 100) { throw "Sample Library is incomplete: only $($soundFiles.Count) audio files found." }
          $vst3Bundle = Get-ChildItem (Join-Path $release 'VST3') -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst3Bundle) { throw 'VST3 bundle missing from VST3 package folder.' }

          @'
          POP PUNK GUITAR ULTIMATE — PORTABLE WINDOWS x64 VST3 QA BUILD
          =============================================================================
          STATUS: PORTABLE QA BUILD. FL STUDIO 20 MANUAL HOST ACCEPTANCE IS STILL REQUIRED.
          VST3/       The compiled Windows x64 VST3 plugin bundle.
          Sample Library/  Factory guitar audio, SFZ maps, licenses and SHA-256 manifest.
          Import Sample Guitar/  Separate user drop-zone; never mixed with factory content.
                      Sound Hunter asset-level registry is empty; final factory admission is pending.
          PRESETS/    Legacy factory catalogue (300 authored definitions) and portable examples.
                      Not the REV.18 target of 500 READY MELODY + 500 READY PATTERN.
          Skins/      Registry-driven visual themes and both legacy/REV14 schema contracts; copy beside the VST3 bundle.
          Resources/  Runtime schemas, source/license summary and checksums.
          Source/     Optional C++ source reference and CMake project file; not required at runtime.
          Documents/ Project documentation, INFO journal and installation/reference notes.
          Licenses/   Project-level license and clearance records.

          PORTABLE USE — NO INSTALLER:
          1. Extract this ZIP anywhere. To use in FL Studio, copy only the .vst3 bundle into your VST3 folder and copy Skins/ beside it. No Setup.exe or installer is used.
          2. Keep Sample Library/ intact. Put personal banks in Import Sample Guitar/ and load their SFZ through IMPORT GUITAR -> LOAD SFZ.
          3. The factory preset catalog is embedded in the plugin and also shipped
             as PRESETS/factory_bank_300.json. Portable preset examples are in PRESETS/examples/.
          4. Skins/ is the runtime palette directory beside the .vst3 bundle. Use SKIN or Ctrl+K to switch themes.
             Theme switching is visual-only; FL Studio 20 host acceptance remains pending.
          5. See Resources/ for source attribution, licenses, checksums and documentation.

          Source/ is included for reference only; JUCE checkout, Git metadata, build intermediates, debug symbols and artwork-only working files are not shipped.
          Automated CMake build, CTest and pluginval results are reported by this workflow.
          FL Studio 20 manual host acceptance remains a separate step and is not implied.
          This interim artifact does not certify 1000 READY presets, full Sound Hunter clearance,
          final FX EDIT / Skin Gallery / Settings acceptance, CPU/RAM targets or release readiness.
          '@ | Set-Content -Encoding utf8 (Join-Path $release 'PORTABLE_README.txt')

          # Keep the ZIP runtime-only: remove temporary/cache/build debris, but retain
          # the VST3 bundle, approved Skins, factory Sample Library, user Import Sample Guitar folder, presets and provenance.
          Get-ChildItem -LiteralPath $release -Directory -Force -Recurse |
            Where-Object { $_.Name -in @('.git', '__pycache__', '.pytest_cache', 'CMakeFiles') } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $release -File -Force -Recurse |
            Where-Object { $_.Extension -in @('.pdb', '.ilk', '.exp', '.lib', '.obj', '.pch', '.log', '.tmp', '.pyc') -or $_.Name -in @('.DS_Store', 'Thumbs.db') } |
            Remove-Item -Force
          if (-not (Get-ChildItem (Join-Path $release 'VST3') -Directory -Filter '*.vst3' | Select-Object -First 1)) {
            throw 'Portable package cleanup removed or failed to include the VST3 bundle.'
          }
          foreach ($requiredFolder in @('Sample Library', 'Import Sample Guitar', 'PRESETS', 'Skins', 'Resources', 'Source', 'Documents', 'Licenses')) {
            $folderPath = Join-Path $release $requiredFolder
            if (-not (Test-Path -LiteralPath $folderPath -PathType Container) -or -not (Get-ChildItem -LiteralPath $folderPath -Force | Select-Object -First 1)) {
              throw "Portable package folder is missing or empty: $requiredFolder"
            }
          }
          $zipPath = Join-Path $PWD 'POP_PUNK_GUITAR_ULTIMATE_PORTABLE_VST3_Windows_x64.zip'
          if (Test-Path $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $zipPath -Force

      - uses: actions/upload-artifact@v4
        with:
          name: POP-PUNK-GUITAR-ULTIMATE-PORTABLE-VST3-Windows-x64
          path: POP_PUNK_GUITAR_ULTIMATE_PORTABLE_VST3_Windows_x64.zip
          if-no-files-found: error

