name: PPGU Skin Expansion 53-102

on:
  push:
    branches:
      - work/ppgu-skin-expansion-53-102
    paths:
      - .github/workflows/ppgu-skin-expansion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ppgu-skin-expansion-53-102
  cancel-in-progress: false

jobs:
  generate-validate-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout skin expansion branch
        uses: actions/checkout@v4
        with:
          ref: work/ppgu-skin-expansion-53-102
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight current registry and generator
        run: |
          python tools/generate_skin_batch.py --dry-run
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("SKIN/theme_manifest.json").read_text(encoding="utf-8"))
          assert registry["totalSkins"] == len(registry["themes"])
          assert registry["totalSkins"] == 52, registry["totalSkins"]
          assert registry["defaultSkin"] == "skin-052"
          print("PREFLIGHT PASS: 52 existing skins; next batch must be 53-102.")
          PY

      - name: Generate 50 additional visual themes and artwork assets
        run: python tools/generate_skin_batch.py

      - name: Validate generated pack (G1-G4)
        run: python tools/validate_skin_pack.py --root SKIN --manifest SKIN/theme_pack_manifest.json

      - name: Merge pack into canonical theme registry
        run: python tools/merge_skin_pack.py --root SKIN --manifest SKIN/theme_pack_manifest.json

      - name: Revalidate merged pack and all skin manifests
        run: |
          python tools/validate_skin_pack.py --root SKIN --manifest SKIN/theme_pack_manifest.json
          python tests/ValidateSkinManifests.py

      - name: Verify final registry range and pack state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("SKIN/theme_manifest.json").read_text(encoding="utf-8"))
          pack = json.loads(Path("SKIN/theme_pack_manifest.json").read_text(encoding="utf-8"))
          assert registry["totalSkins"] == 102
          assert len(registry["themes"]) == 102
          assert registry["defaultSkin"] == "skin-052"
          assert pack["status"] == "MERGED"
          assert pack["startIndex"] == 53 and pack["endIndex"] == 102
          assert pack["mergedRegistryTotal"] == 102
          print("FINAL PASS: 102 skins registered; default remains SIGNAL FORGE (Skin_052).")
          PY

      - name: Commit generated skins and canonical registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKIN
          if git diff --cached --quiet; then
            echo "No generated skin changes to commit."
          else
            git commit -m "feat(skins): add premium visual themes 53-102"
            git push origin HEAD:work/ppgu-skin-expansion-53-102
          fi

# Re-triggered after confirming the previous push did not produce generated skin files.
