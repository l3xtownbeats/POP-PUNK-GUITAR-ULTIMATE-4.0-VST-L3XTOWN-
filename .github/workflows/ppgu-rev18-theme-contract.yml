name: PPGU REV18 Theme Contract
on:
  push:
    branches:
      - work/ppgu-rev18-premium-theme-assets
    paths:
      - 'SKIN/**'
      - 'tools/**'
      - 'tests/TestRev18ThemeControlParity.py'
      - '.github/workflows/ppgu-rev18-theme-contract.yml'
  pull_request:
    branches:
      - ui/neon-stage-skin1-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install artwork generator dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Generate full approved theme asset packs
        run: python3 tools/generate_rev18_approved_theme_assets.py --root SKIN
      - name: Verify deterministic generation and no-overwrite contract
        run: python3 tools/generate_rev18_approved_theme_assets.py --root SKIN --check
      - name: Validate exact approved 27-control parity
        run: python3 tests/TestRev18ThemeControlParity.py
      - name: Audit complete theme packs, SHA-256 and PNG CRC
        run: python3 tools/audit_skin_rev18_assets.py --root SKIN --strict-assets
      - name: Commit generated theme packs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKIN
          if ! git diff --cached --quiet; then
            git commit -m "assets(REV18): generate approved premium theme packs"
            git push
          else
            echo "Generated assets already match the committed pack."
          fi
